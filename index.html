<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor AI OS - Working Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;overflow:hidden}button,input,select,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#101010;border-right:1px solid #232323;display:flex;flex-direction:column;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:18px 20px;border-bottom:1px solid #222}.logo{background:#df171b;color:#fff;font-weight:800;border-radius:4px;padding:8px 10px;font-size:12px}.btitle{font-weight:800;font-size:16px}.bsub{color:#888;font-size:12px;margin-top:3px}.nav{padding:14px 8px}.nav button{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#bbb;padding:12px 14px;border-radius:6px;text-align:left;cursor:pointer;margin-bottom:3px}.nav button:hover{background:#1c1c1c;color:#fff}.nav button.active{background:#242424;color:#fff;border-left:3px solid #e31b23}.main{display:flex;flex-direction:column;min-width:0}.top{height:70px;border-bottom:1px solid #202020;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b0b0b}.title{font-size:21px;font-weight:800}.subtitle{font-size:13px;color:#888;margin-top:5px}.content{flex:1;overflow:auto;padding:22px 24px}.content::-webkit-scrollbar,.side::-webkit-scrollbar{width:6px;height:6px}.content::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:#333;border-radius:6px}.screen{display:none}.screen.active{display:block}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#1a1a1a;border:1px solid #303030;border-radius:8px;padding:18px}.card h3{margin:0 0 12px}.metric{border-left:3px solid #e31b23}.metric.blue{border-left-color:#3b82f6}.metric.green{border-left-color:#22c55e}.metric.amber{border-left-color:#f59e0b}.mlabel{color:#666;text-transform:uppercase;letter-spacing:.06em;font-size:11px}.mnum{font-size:30px;font-weight:900;margin-top:10px}.red{color:#e31b23}.green{color:#22c55e}.amber{color:#f59e0b}.blue{color:#3b82f6}.muted{color:#888}.btn{border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:#242424;color:#fff}.btn:hover{filter:brightness(1.15)}.btn.red{background:#e31b23;color:#fff}.btn.green{background:#0f7a3b;color:#fff}.btn.ghost{border:1px solid #333;background:transparent;color:#bbb}.btn.small{font-size:12px;padding:7px 10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:transparent;border:0;color:#777;padding:9px 13px;border-radius:5px;cursor:pointer}.tab.active{background:#e31b23;color:#fff}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.06em}input,select,textarea{width:100%;background:#090909;border:1px solid #333;color:#fff;border-radius:5px;padding:11px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#e31b23}textarea{min-height:100px;resize:vertical}.upload{border:1px dashed #444;border-radius:7px;padding:18px;text-align:center;background:#0d0d0d;color:#888}.checkrow{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:#bbb}.checkrow input{width:auto;accent-color:#e31b23}.table{width:100%;border-collapse:collapse;background:#171717;border:1px solid #303030;border-radius:8px;overflow:hidden}.table th{text-align:left;background:#0f0f0f;color:#666;text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding:12px}.table td{border-top:1px solid #262626;padding:13px;color:#ccc}.badge{font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;display:inline-block}.badge.red{background:#451316;color:#ff6767}.badge.green{background:#0b3d20;color:#27d66c}.badge.amber{background:#4b3308;color:#ffc247}.badge.blue{background:#102d55;color:#5aa2ff}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99;align-items:center;justify-content:center;padding:20px}.modalbg.show{display:flex}.modal{background:#1d1d1d;border:1px solid #3a3a3a;border-radius:10px;width:min(720px,96vw);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #000}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h2{font-size:18px;margin:0}.x{background:transparent;border:0;color:#777;font-size:22px;cursor:pointer}.statusbar{position:fixed;bottom:0;left:250px;right:0;height:22px;background:#070707;border-top:1px solid #202020;color:#1ee66b;font-size:12px;display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0 15px}.cardsmall{background:#101010;border:1px solid #2a2a2a;border-radius:7px;padding:14px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.flow .cardsmall{min-height:100px}.kbd{font-family:monospace;background:#111;border:1px solid #333;padding:3px 7px;border-radius:4px}.chat{height:430px;display:flex;flex-direction:column;border:1px solid #333;border-radius:8px;overflow:hidden}.msgs{flex:1;padding:14px;overflow:auto}.msg{padding:10px;border-radius:8px;margin-bottom:10px;max-width:85%;white-space:pre-line}.msg.u{margin-left:auto;background:#3b1012}.msg.a{background:#111;border:1px solid #303030}.chatbar{display:flex;gap:8px;border-top:1px solid #333;padding:10px}.chatbar input{flex:1}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .day{background:#14351f;border:1px solid #235c35;color:#29da70;border-radius:5px;text-align:center;padding:11px 0;cursor:pointer}.cal .day.booked{background:#401013;border-color:#742026;color:#ff5656}.cal .day.partial{background:#4a310d;border-color:#8a5c14;color:#ffc247}.cal .day:hover{filter:brightness(1.25)}.timegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.timebtn{border:1px solid #333;background:#0e0e0e;color:#fff;padding:9px;border-radius:5px;cursor:pointer}.timebtn.active{background:#e31b23;border-color:#e31b23}.rightnote{background:#04240d;border:1px solid #0b7031;color:#d8ffe4;border-radius:7px;padding:14px;margin-top:12px}.output{display:none;margin-top:16px;border:1px solid #235c35;background:#061a0d;border-radius:8px;padding:16px}.output pre{white-space:pre-wrap;color:#d4d4d4;background:#0b0b0b;border-radius:5px;padding:13px;max-height:260px;overflow:auto}.pillbar{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#111;border:1px solid #303030;border-radius:999px;padding:7px 12px;color:#bbb}.dangerbox{background:#280d0f;border:1px solid #742026;padding:12px;border-radius:7px;color:#ffb0b0}@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.grid4{grid-template-columns:repeat(2,1fr)}.grid3,.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.statusbar{left:210px}.flow{grid-template-columns:1fr}}
.brand{min-height:92px;align-items:center}
.brand-logo-wrap{width:72px;height:50px;border-radius:7px;overflow:hidden;background:#050505;border:1px solid #292929;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(227,27,35,.18)}
.brand-logo-img{width:118px;height:auto;display:block}
.brand-copy{min-width:0}
.brand-wordmark{font-weight:900;font-size:16px;letter-spacing:.01em;line-height:1.1}
.brand-wordmark .ai{color:#e31b23}
.brand-tagline{color:#8d8d8d;font-size:11px;margin-top:4px;line-height:1.25}
.header-logo{height:38px;width:140px;object-fit:cover;object-position:left center;border-radius:5px;opacity:.95}

</style>

// Save uploaded asset into state and create an approval request.
function saveAsset(){
  const name=document.getElementById('assetName').value.trim();
  const project=document.getElementById('assetProject').value;
  const type=document.getElementById('assetType').value;
  if(!name){alert('Please enter asset name');return;}
  const id='AS-'+String(Math.floor(Math.random()*900+100));
  state.assets.unshift({id,name,project,type,status:'Pending'});
  // Add approval request for new asset
  state.approvals.unshift({id:'A-'+Math.floor(Math.random()*900+200),type:'Asset Upload',title:`${name} uploaded`,owner:'System',status:'Pending',note:'New asset awaiting review'});
  closeModal();
  demoOutput('Asset saved. Awaiting approval.');
  setScreen('assets');
}

// Save generated report entry
function saveReport(){
  const type=document.getElementById('reportType').value;
  const from=document.getElementById('reportFrom').value;
  const to=document.getElementById('reportTo').value;
  const id='R-'+String(Math.floor(Math.random()*900+200));
  const name=type+(from&&to?` (${from} to ${to})`:'');
  state.reports.unshift({id,name,date:new Date().toISOString().substring(0,10),status:'Ready'});
  closeModal();
  demoOutput('Report generated and added to list.');
  setScreen('reports');
}
function openProjectDetail(p){openModal(p+' Master Data',`<div class="grid2"><div class="cardsmall"><b>Payment Plan</b><p class="muted">Stored in KB. Used by proposals and offers.</p></div><div class="cardsmall"><b>Assets</b><p class="muted">Brochure, floor plans, renders and PPT linked.</p></div><div class="cardsmall"><b>Sales Angles</b><p class="muted">Investor, end-user and agent scripts.</p></div><div class="cardsmall"><b>Compliance</b><p class="muted">Approved claims and wording only.</p></div></div>`)}
function openKBEntry(){openModal('Add Knowledge Base Entry',`<div class="formgrid"><div class="field"><label>Type *</label><select><option>Project Master Data</option><option>Sales Offer</option><option>Payment Plan</option><option>Developer Profile</option><option>Meeting Notes</option><option>Guideline</option></select></div><div class="field"><label>Project / Department</label><select><option>J188</option><option>T88</option><option>NBP</option><option>Management</option><option>Marketing</option></select></div><div class="field full"><label>Content *</label><textarea></textarea></div><div class="field full upload"><input type="file" multiple><br>Upload supporting documents.</div></div><br><button class="btn red" onclick="closeModal();demoOutput('Knowledge Base entry saved and indexed.')">Save</button>`)}
function openKBChat(){setScreen('kb')}
function askKB(){let q=document.getElementById('kbQ').value.trim(); if(!q)return; let m=document.getElementById('kbMsgs');m.innerHTML+=`<div class="msg u">${esc(q)}</div><div class="msg a">Based on approved Knowledge Base data:\n• Project details found\n• Payment plan and offer terms checked\n• No unsupported claims used\n• Suggested next step: generate proposal or send for approval.</div>`;document.getElementById('kbQ').value='';m.scrollTop=m.scrollHeight;}
function generateDoc(){let name=document.getElementById('clientName')?.value||'Selected client'; let type=state.docType; docOut.style.display='block'; docPre.textContent=`${type.toUpperCase()} GENERATED\n\nFor: ${name}\nProject: J188 Tower\nData source: Knowledge Base\nValidation: Passed\n\nIncluded:\n- Client requirement summary\n- Project overview\n- Approved payment / offer terms\n- Attachments checklist\n- Compliance notes\n\nStatus: Sent to Approval Hub before external use.`; state.approvals.unshift({id:'A-'+Math.floor(Math.random()*900+200),type:'Document',title:`${type} generated for ${name}`,owner:'System',status:'Pending',note:'Generated document waiting for approval'});}
function openTask(id){let t=state.tasks.find(x=>x.id===id);openModal('Task Detail',`<p><b>${t.title}</b></p><p class="muted">Owner: ${t.owner}<br>Status: ${t.status}<br>Deadline: ${t.deadline}</p><div class="rightnote">AI brief, missing info checklist, attachments and approval trail are tracked here.</div>`)}
function submitSmartTask(){state.tasks.unshift({id:'T-'+Math.floor(Math.random()*900+100),title:'New smart task created',owner:'Rabab',status:'AI Review',deadline:'2026-06-08'});state.approvals.unshift({id:'A-'+Math.floor(Math.random()*900+100),type:'Task',title:'New task requires approval',owner:'Rabab',status:'Pending',note:'AI brief generated. Missing info checked.'});demoOutput('Task created. AI brief generated and approval item added.');}
function approveItem(id){let a=state.approvals.find(x=>x.id===id); if(a)a.status='Approved'; setScreen('approval');}
function reviseItem(id){let a=state.approvals.find(x=>x.id===id); if(a)a.status='Revision Required'; setScreen('approval');}
function approveAllDemo(){state.approvals.forEach(a=>a.status='Approved');setScreen('approval');}
function loadSampleQA(){document.getElementById('qaText').value='Ready property in Discovery Gardens from AED 1.1M. Best ROI guaranteed. Free DLD. Book now.';}
function runQA(){let txt=document.getElementById('qaText').value||'Sample content';qaOut.style.display='block';qaPre.textContent=`AI QA RESULT\n\nInput checked: ${txt}\n\nIssues found:\n1. Avoid guaranteed ROI unless legally supported.\n2. Replace “Free DLD” with “DLD fees covered by the seller” if approved.\n3. Add payment plan / price source if used.\n4. CTA can be stronger.\n\nImproved version:\nReady property in Discovery Gardens from AED 1.1M. DLD fees covered by the seller, subject to approved offer terms. Limited availability. Book your viewing today.\n\nScores:\nGrammar: 100%\nCompliance: 94%\nConversion: 91%\nRecommendation: Send to Approval Hub.`;}
function openShootBooking(date){state.selectedShootDate=date||state.selectedShootDate;let times=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];openModal('New Shoot / Event Booking',`<div class="formgrid"><div class="field"><label>Event / Shoot Type *</label><select id="shType"><option>Open House RSVP</option><option>Launch Event</option><option>Video Shoot</option><option>Portal Listing Photography</option><option>Employee Event</option></select></div><div class="field"><label>Project *</label><select id="shProject"><option>J188</option><option>T88</option><option>NBP</option><option>Discovery Gardens</option></select></div><div class="field"><label>Date *</label><input id="shDate" type="date" value="${state.selectedShootDate}"></div><div class="field"><label>Working Time *</label><div class="timegrid">${times.map(t=>`<button class="timebtn ${t===state.time?'active':''}" onclick="selectTime('${t}',this)">${t}</button>`).join('')}</div></div><div class="field"><label>Assign Team *</label><select id="shTeam"><option>Mel</option><option>Keith</option><option>Eslam</option><option>Mel + Keith</option><option>Keith + Eslam</option></select></div><div class="field"><label>Location *</label><input id="shLoc" placeholder="e.g. T88 Tower, Business Bay"></div><div class="field full"><label>Requirements</label><textarea id="shReq" placeholder="Camera, drone, social coverage, event setup..."></textarea></div></div><div class="rightnote"><b>Approval flow:</b> Request → Approval Hub → Approved → Media team attends.</div><br><button class="btn red" onclick="createShoot()">Create Request for Approval</button>`)}
function selectTime(t,btn){state.time=t;document.querySelectorAll('.timebtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function createShoot(){let d=document.getElementById('shDate').value,t=state.time,team=document.getElementById('shTeam').value,project=document.getElementById('shProject').value,type=document.getElementById('shType').value;let title=project+' '+type;state.shoots.unshift({id:'NEW',title,type,project,datetime:d+' '+t,team,status:'Pending Approval'});state.approvals.unshift({id:'A-'+Math.floor(Math.random()*900+100),type:'Shoot Request',title,owner:team,status:'Pending',note:'Approval required before media team attends'});closeModal();setScreen('shoots');}
function openShootDetail(id){let s=state.shoots.find(x=>x.id===id);openModal('Shoot Detail',`<p><b>${s.title}</b></p><p class="muted">${s.project}<br>${s.datetime}<br>Team: ${s.team}<br>Status: ${s.status}</p><div class="dangerbox">Media team attends only after Approval Hub approval.</div>`)}
function openGuideline(){openModal('Add Guideline',`<div class="formgrid"><div class="field"><label>Guideline Name *</label><input id="gName" placeholder="e.g. Working Hours"></div><div class="field"><label>Applies To</label><select id="gScope"><option>All Modules</option><option>Shoots</option><option>Documents</option><option>Tasks</option><option>AI QA</option><option>Approvals</option></select></div><div class="field full"><label>Rule / Standard *</label><textarea id="gValue" placeholder="e.g. Shoot bookings are only allowed from 09:00 to 18:00"></textarea></div></div><br><button class="btn red" onclick="saveGuideline()">Save Guideline</button>`)}
function saveGuideline(){let n=document.getElementById('gName').value||'New Guideline';let v=document.getElementById('gValue').value||'New operating rule';let s=document.getElementById('gScope').value;state.guidelines.unshift({name:n,value:v,scope:s,active:true});closeModal();setScreen('guidelines');}
function editGuideline(i){let g=state.guidelines[i];openModal('Edit Guideline',`<div class="formgrid"><div class="field"><label>Name</label><input id="egName" value="${esc(g.name)}"></div><div class="field"><label>Scope</label><input id="egScope" value="${esc(g.scope)}"></div><div class="field full"><label>Rule</label><textarea id="egValue">${esc(g.value)}</textarea></div></div><br><button class="btn red" onclick="state.guidelines[${i}]={name:egName.value,value:egValue.value,scope:egScope.value,active:true};closeModal();setScreen('guidelines')">Update</button>`)}
function openCopilot(){openModal('Harbor AI Copilot',`<div class="chat"><div class="msgs" id="aiMsgs"><div class="msg a">I can answer from tasks, projects, Knowledge Base, approvals, guidelines and reports.</div></div><div class="chatbar"><input id="aiQ" placeholder="Ask Harbor AI..."><button class="btn red" onclick="askAI()">Ask</button></div></div>`)}
function askAI(){let q=aiQ.value.trim(); if(!q)return; aiMsgs.innerHTML+=`<div class="msg u">${esc(q)}</div><div class="msg a">Based on the prototype data:\n• Relevant project / KB data checked\n• Guidelines applied\n• Approval requirement identified\n• Next action suggested in the correct module.</div>`; aiQ.value=''; aiMsgs.scrollTop=aiMsgs.scrollHeight;}
init();
</script>
</body>
</html>
